<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1028">
  <title>星屑回声｜原创视觉小说</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <section id="title-screen" class="screen active">
      <div class="title-bg"></div><div class="stars"></div><div class="vignette"></div>
      <div class="title-copy">
        <p class="eyebrow">ORIGINAL VISUAL NOVEL</p>
        <h1>星屑回声</h1>
        <p class="jp">Stardust Echo</p>
        <p class="tagline">“如果所有人都会忘记你，我就替星空记住。”</p>
      </div>
      <nav class="title-menu" aria-label="主菜单">
        <button data-title-action="new">开始物语</button>
        <button data-title-action="continue">继续阅读</button>
        <button data-title-action="chapter">章节选择</button>
        <button data-title-action="gallery">回忆画廊</button>
        <button data-title-action="settings">环境设定</button>
      </nav>
      <div class="title-footer">一部关于记忆、约定与夏夜流星的短篇 Galgame</div>
    </section>
    <section id="game-screen" class="screen">
      <div id="scene" class="scene scene-observatory"><div class="scene-overlay"></div><div class="scene-stars"></div></div>
      <div id="character-layer">
        <div id="char-left" class="character left"></div>
        <div id="char-right" class="character right"></div>
      </div>
      <div id="chapter-card"><small>CHAPTER</small><strong></strong><span></span></div>
      <div id="quick-menu">
        <button data-quick="save" title="存档">SAVE</button><button data-quick="load" title="读档">LOAD</button>
        <button data-quick="auto" title="自动播放">AUTO</button><button data-quick="skip" title="快进">SKIP</button>
        <button data-quick="log" title="回看">LOG</button><button data-quick="settings" title="设置">CONFIG</button>
        <button data-quick="title" title="返回标题">TITLE</button>
      </div>
      <div id="choice-box" class="hidden"></div>
      <div id="textbox" role="button" tabindex="0" aria-label="推进对话">
        <div id="nameplate">旁白</div><div id="dialogue"></div><div id="next-indicator">▼</div>
      </div>
    </section>
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-panel">
        <button id="modal-close" class="close">×</button>
        <h2 id="modal-title"></h2><div id="modal-content"></div>
      </div>
    </div>
    <div id="toast"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
