# ==============================================================================
# OneAPIChat Nginx 站点配置 (All-in-One 一体化镜像)
# 兼容域名绑定、反代、动静分离、WebSocket/SSE长连接、Cloudreve、CPA与刷课
# ==============================================================================

# WebSocket 握手协议映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 动态 CORS Origin 判定 (自适应回显任意来源域名)
map $http_origin $cors_origin {
    default $http_origin;
}

server {
    listen 80 default_server;
    listen 8080 default_server;
    server_name _;

    root /var/www/html;
    index index.html index.php index.htm;
    client_max_body_size 4096M;

    # 全局 CORS 头
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
    add_header Access-Control-Allow-Headers "DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization, Auth-Token" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Authorization, Auth-Token" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml image/x-icon;
    gzip_min_length 500;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;

    # ── API v1 OpenAI-compatible 伪静态 ──
    rewrite ^/oneapichat/api/v1/models$ /oneapichat/api/v1/models.php break;
    rewrite ^/oneapichat/api/v1/chat/completions$ /oneapichat/api/v1/chat/completions.php break;
    rewrite ^/oneapichat/api/v1/embeddings$ /oneapichat/api/v1/embeddings.php break;
    rewrite ^/oneapichat/api/v1/mcp$ /oneapichat/api/v1/mcp.php break;
    rewrite ^/api/v1/models$ /oneapichat/api/v1/models.php break;
    rewrite ^/api/v1/chat/completions$ /oneapichat/api/v1/chat/completions.php break;
    rewrite ^/api/v1/embeddings$ /oneapichat/api/v1/embeddings.php break;
    rewrite ^/api/v1/mcp$ /oneapichat/api/v1/mcp.php break;

    # ── 安全防护: 禁止直接访问内部数据目录 ──
    location ^~ /oneapichat/users/ { return 404; }
    location ^~ /oneapichat/chat_data/ { return 404; }
    location ^~ /oneapichat/.engine/ { return 404; }
    location ^~ /oneapichat/config/ { return 404; }
    location ^~ /oneapichat/python/ { return 404; }
    location ^~ /oneapichat/backups/ { return 404; }
    location ~* (config\.ini|\.env|\.git|learning_records\.db) { return 404; }

    # ── 快捷重定向 ──
    location = / {
        return 301 /oneapichat/;
    }
    location = /chaoxing {
        return 301 /oneapichat/chaoxing.html;
    }
    location = /chaoxing.html {
        return 301 /oneapichat/chaoxing.html;
    }

    # ── CPA (CLIProxyAPI) 代理面板与模型端点 ──
    location = /cpa { return 301 /cpa/management.html; }
    location = /cpa/ { return 301 /cpa/management.html; }
    location ^~ /cpa/ {
        proxy_pass http://127.0.0.1:8317/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location ^~ /v0/ {
        proxy_pass http://127.0.0.1:8317;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # ── Cloudreve 云盘反代与 SSO ──
    location = /api/oneapichat-sso {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/oneapichat/api/cloudreve_login.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
    location = /cloudreve_sso.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/oneapichat/api/cloudreve_sso.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
    location = /cr_login.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/oneapichat/api/cloudreve_login.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
    location ^~ /cloudreve/ {
        proxy_pass http://127.0.0.1:5212/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        client_max_body_size 4096M;
    }

    # ── Python FastAPI Engine (流式聊天、Agent、工具执行) ──
    location /engine/ {
        gzip off;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 7200s;
        proxy_connect_timeout 10s;
        client_max_body_size 4096M;
    }

    # ── OneAPIChat 主站路径 ──
    location ^~ /oneapichat/ {
        alias /var/www/html/oneapichat/;
        index index.html index.php;

        if ($request_method = OPTIONS) { return 204; }

        # HTML 页面禁用缓存确保更新及时
        location ~ \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 静态资源缓存
        location ~* \.(js|css)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            add_header Access-Control-Allow-Origin "*";
        }
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable, max-age=2592000";
            add_header Access-Control-Allow-Origin "*";
        }

        # PHP 执行
        location ~ \.php$ {
            # 禁止 uploads 目录执行 PHP
            if ($request_filename ~ ^/var/www/html/oneapichat/uploads/) { return 403; }
            include fastcgi_params;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_buffering off;
            fastcgi_read_timeout 1000s;
            fastcgi_send_timeout 1000s;
        }

        try_files $uri $uri/ /oneapichat/public/index.html;
    }

    # 根路径通用回退
    location / {
        try_files $uri $uri/ /oneapichat/public/index.html;
    }
}
