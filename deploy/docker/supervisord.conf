[supervisord]
nodaemon=true
loglevel=info
user=root
pidfile=/run/supervisord.pid
logfile=/var/log/supervisor/supervisord.log

[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=/usr/sbin/php-fpm8.2 -F
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:engine]
command=python3 /var/www/html/oneapichat/python/engine_server.py
directory=/var/www/html/oneapichat
user=www-data
autostart=true
autorestart=true
priority=30
environment=PYTHONUNBUFFERED="1",ENGINE_HOST="127.0.0.1",ENGINE_PORT="8766",PYTHONPATH="/usr/local/lib/python3.11/site-packages",PATH="/usr/local/bin:/usr/bin:/bin"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cloudreve]
command=/usr/local/bin/cloudreve -c /var/www/cloudreve/data/conf.ini
directory=/var/www/cloudreve
user=www-data
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cli-proxy-api]
command=/usr/local/bin/CLIProxyAPI
directory=/var/www/cpa
user=www-data
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:perms-healer]
command=/bin/bash /usr/local/bin/perms-healer.sh
autostart=true
autorestart=true
priority=99
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
